[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "review-tiers"
version = "0.1.0"
description = "Risk tiers and review guides for pull requests and merge requests."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
review-tiers = "review_tiers.cli:main"

[tool.setuptools.packages.find]
include = ["review_tiers*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
